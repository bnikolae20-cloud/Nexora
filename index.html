
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>NEXORA — Messenger</title>

<style>
:root {
  --bg:#0b1220;
  --panel:#111c2e;
  --panel2:#17243a;
  --accent:#5b9dff;
  --text:#f1f5fb;
  --muted:#91a0b7;
  --border:#263650;
  --green:#35d49a;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial,sans-serif;height:100vh;overflow:hidden
}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#authScreen{
  min-height:100vh;display:flex;align-items:center;
  justify-content:center;padding:20px
}
.auth-box{
  width:100%;max-width:390px;background:var(--panel);
  padding:28px;border:1px solid var(--border);
  border-radius:20px
}
.logo{text-align:center;font-size:30px;font-weight:bold;margin-bottom:8px}
.subtitle{text-align:center;color:var(--muted);margin-bottom:25px}
.field{margin:13px 0}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}
.field input{
  width:100%;padding:14px;border-radius:11px;
  border:1px solid var(--border);background:var(--bg);
  color:var(--text);outline:none
}
.field input:focus{border-color:var(--accent)}
.primary{
  width:100%;padding:14px;border:0;border-radius:11px;
  background:var(--accent);color:white;font-weight:bold;margin-top:10px
}
.switch{text-align:center;color:var(--muted);font-size:14px;margin-top:20px}
.link-btn{
  background:none;border:0;color:var(--accent);
  padding:5px;font-weight:bold
}
.error{color:#ff7777;font-size:13px;margin-top:12px;text-align:center}
#app{
  height:100vh;display:flex;max-width:1200px;
  margin:auto;border-left:1px solid var(--border);
  border-right:1px solid var(--border)
}
.sidebar{
  width:340px;min-width:280px;background:var(--panel);
  border-right:1px solid var(--border);display:flex;flex-direction:column
}
.top{
  padding:18px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center
}
.brand{font-size:23px;font-weight:bold}
.me{padding:15px;border-bottom:1px solid var(--border)}
.me-name{font-weight:bold}
.me-user{color:var(--muted);font-size:13px;margin-top:5px}
.search{padding:12px}
.search input{
  width:100%;padding:12px;border-radius:10px;
  border:1px solid var(--border);background:var(--bg);
  color:white;outline:none
}
.search-result{padding:0 12px}
.small-btn{
  border:1px solid var(--border);background:var(--panel2);
  color:var(--text);padding:9px 12px;border-radius:9px
}
.chat-list{overflow:auto;flex:1}
.chat-item{
  padding:15px;border-bottom:1px solid var(--border);
  cursor:pointer
}
.chat-item:hover,.chat-item.active{background:var(--panel2)}
.chat-item strong{display:block;margin-bottom:5px}
.chat-item small{color:var(--muted)}
.logout{
  margin:12px;padding:11px;border:1px solid var(--border);
  background:transparent;color:#ff8585;border-radius:9px
}
.main{
  flex:1;display:flex;flex-direction:column;min-width:0
}
.empty{
  flex:1;display:flex;align-items:center;justify-content:center;
  text-align:center;color:var(--muted);padding:20px
}
.chat-header{
  padding:16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px
}
.chat-header strong{display:block}
.online{font-size:12px;color:var(--green);margin-top:4px}
.messages{
  flex:1;overflow:auto;padding:20px;
  display:flex;flex-direction:column;gap:10px
}
.message{
  max-width:78%;padding:11px 14px;border-radius:14px;
  background:var(--panel2);align-self:flex-start;
  overflow-wrap:anywhere;white-space:pre-wrap
}
.message.mine{
  background:#245b9c;align-self:flex-end
}
.message time{
  display:block;text-align:right;font-size:10px;
  color:#c5d5eb;margin-top:5px
}
.send-area{
  padding:13px;border-top:1px solid var(--border);
  display:flex;gap:10px
}
.send-area input{
  flex:1;min-width:0;padding:13px;border-radius:12px;
  border:1px solid var(--border);background:var(--panel);
  color:white;outline:none
}
.send-area button{
  border:0;background:var(--accent);color:white;
  padding:0 20px;border-radius:12px;font-weight:bold
}
@media(max-width:650px){
  .sidebar{width:100%;min-width:0}
  .main{display:none}
  #app.chat-open .sidebar{display:none}
  #app.chat-open .main{display:flex;width:100%}
}
</style>
</head>

<body>

<section id="authScreen">
  <div class="auth-box">
    <div class="logo">NEXORA</div>
    <div class="subtitle">Твой личный мессенджер</div>

    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input id="loginEmail" type="email" placeholder="example@email.com" required>
      </div>
      <div class="field">
        <label>Пароль</label>
        <input id="loginPassword" type="password" placeholder="Твой пароль" required>
      </div>
      <button class="primary" type="submit">Войти</button>
      <div class="switch">
        Нет аккаунта?
        <button type="button" class="link-btn"
          onclick="showRegister()">Создать аккаунт</button>
      </div>
    </form>

    <form id="registerForm" class="hidden">
      <div class="field">
        <label>Имя пользователя</label>
        <input id="regUsername" placeholder="Например: kolya" minlength="3" maxlength="20" required>
      </div>
      <div class="field">
        <label>Email</label>
        <input id="regEmail" type="email" placeholder="example@email.com" required>
      </div>
      <div class="field">
        <label>Пароль (минимум 6 символов)</label>
        <input id="regPassword" type="password" minlength="6" required>
      </div>
      <button class="primary" type="submit">Зарегистрироваться</button>
      <div class="switch">
        Уже есть аккаунт?
        <button type="button" class="link-btn"
          onclick="showLogin()">Войти</button>
      </div>
    </form>
    <div id="authError" class="error"></div>
  </div>
</section>

<section id="app" class="hidden">
  <aside class="sidebar">
    <div class="top">
      <div class="brand">NEXORA</div>
      <span style="color:var(--green);font-size:12px">● ONLINE</span>
    </div>

    <div class="me">
      <div class="me-name" id="myName">Пользователь</div>
      <div class="me-user" id="myUsername">@username</div>
    </div>

    <div class="search">
      <input id="searchUsername" placeholder="Найти по @username">
    </div>
    <div class="search-result" id="searchResult"></div>

    <div style="padding:12px 15px;color:var(--muted);font-size:13px">
      МОИ ЧАТЫ
    </div>
    <div class="chat-list" id="chatList"></div>
    <button class="logout" id="logoutBtn">Выйти из аккаунта</button>
  </aside>

  <main class="main">
    <div id="emptyState" class="empty">
      <div>
        <div style="font-size:45px">💬</div>
        <h3>NEXORA Messenger</h3>
        <p>Найди пользователя и начни общение</p>
      </div>
    </div>

    <div id="chatArea" class="hidden"
      style="flex:1;display:flex;flex-direction:column;min-height:0">
      <div class="chat-header">
        <button class="small-btn" id="backBtn">←</button>
        <div>
          <strong id="chatName">Пользователь</strong>
          <div class="online" id="chatStatus">Не в сети</div>
        </div>
      </div>
      <div class="messages" id="messages"></div>
      <form class="send-area" id="sendForm">
        <input id="messageInput" placeholder="Написать сообщение..." autocomplete="off">
        <button type="submit">➤</button>
      </form>
    </div>
  </main>
</section>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
/* ПЕРЕКЛЮЧЕНИЕ ФОРМ — РАБОТАЕТ НЕЗАВИСИМО ОТ FIREBASE */
function showRegister(){
  document.getElementById("loginForm").classList.add("hidden");
  document.getElementById("registerForm").classList.remove("hidden");
  document.getElementById("authError").textContent="";
}
function showLogin(){
  document.getElementById("registerForm").classList.add("hidden");
  document.getElementById("loginForm").classList.remove("hidden");
  document.getElementById("authError").textContent="";
}

const firebaseConfig = {
  apiKey: "AIzaSyBe15TatfyOu36C89etqRa9vn_Vq_nEH-Y",
  authDomain: "nexora-4d562.firebaseapp.com",
  databaseURL: "https://nexora-4d562-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "nexora-4d562",
  storageBucket: "nexora-4d562.firebasestorage.app",
  messagingSenderId: "285394591386",
  appId: "1:285394591386:web:42379747aa1e1796764923"
};

const authScreen=document.getElementById("authScreen");
const appScreen=document.getElementById("app");
const errorBox=document.getElementById("authError");
const $=id=>document.getElementById(id);

let auth,db,currentUser=null,myProfile=null;
let activeChat=null;
let messagesUnsubscribe=null;
let chatListUnsubscribe=null;
let statusUnsubscribe=null;
let currentChatUser=null;

try{
  firebase.initializeApp(firebaseConfig);
  auth=firebase.auth();
  db=firebase.database();
}catch(e){
  errorBox.textContent="Ошибка запуска Firebase: "+e.message;
}

function showError(message){
  errorBox.textContent=message;
}

function cleanUsername(value){
  return value.trim().toLowerCase().replace(/^@/,"");
}

function chatIdFor(a,b){
  return [a,b].sort().join("_");
}

/* РЕГИСТРАЦИЯ */
$("registerForm").addEventListener("submit",async e=>{
  e.preventDefault();
  showError("");

  const username=cleanUsername($("regUsername").value);
  const email=$("regEmail").value.trim();
  const password=$("regPassword").value;

  if(!/^[a-z0-9_]{3,20}$/.test(username)){
    showError("Username: 3–20 символов, только латинские буквы, цифры и _");
    return;
  }

  try{
    const credential=await auth.createUserWithEmailAndPassword(email,password);
    const uid=credential.user.uid;

    const usernameRef=db.ref("usernames/"+username);
    const result=await usernameRef.transaction(value=>{
      if(value===null) return uid;
      return;
    });

    if(!result.committed){
      await credential.user.delete();
      showError("Этот username уже занят. Выбери другой.");
      return;
    }

    await db.ref("users/"+uid).set({
      uid,
      username,
      email,
      createdAt:firebase.database.ServerValue.TIMESTAMP
    });

  }catch(error){
    showError(firebaseError(error));
  }
});

/* ВХОД */
$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  showError("");
  try{
    await auth.signInWithEmailAndPassword(
      $("loginEmail").value.trim(),
      $("loginPassword").value
    );
  }catch(error){
    showError(firebaseError(error));
  }
});

function firebaseError(error){
  const messages={
    "auth/email-already-in-use":"Этот email уже зарегистрирован.",
    "auth/invalid-email":"Неправильный email.",
    "auth/weak-password":"Пароль слишком простой.",
    "auth/user-not-found":"Аккаунт не найден.",
    "auth/wrong-password":"Неверный пароль.",
    "auth/invalid-credential":"Неверный email или пароль.",
    "auth/network-request-failed":"Проверь подключение к интернету.",
    "PERMISSION_DENIED":"Firebase запретил доступ. Проверь Database Rules."
  };
  return messages[error.code]||error.message||"Произошла ошибка.";
}

/* СОСТОЯНИЕ АВТОРИЗАЦИИ */
auth.onAuthStateChanged(async user=>{
  if(!user){
    currentUser=null;
    myProfile=null;
    authScreen.classList.remove("hidden");
    appScreen.classList.add("hidden");
    stopListeners();
    return;
  }

  currentUser=user;
  try{
    const snap=await db.ref("users/"+user.uid).once("value");
    myProfile=snap.val();

    if(!myProfile){
      showError("Профиль не найден. Возможно, регистрация не завершилась.");
      await auth.signOut();
      return;
    }

    authScreen.classList.add("hidden");
    appScreen.classList.remove("hidden");
    $("myName").textContent=myProfile.username;
    $("myUsername").textContent="@"+myProfile.username;

    setupPresence();
    loadChats();
  }catch(error){
    showError(firebaseError(error));
  }
});

/* ONLINE */
function setupPresence(){
  const statusRef=db.ref("status/"+currentUser.uid);
  const connectedRef=db.ref(".info/connected");

  connectedRef.on("value",snap=>{
    if(snap.val()===true){
      statusRef.onDisconnect().set({
        state:"offline",
        lastSeen:firebase.database.ServerValue.TIMESTAMP
      });
      statusRef.set({
        state:"online",
        lastSeen:firebase.database.ServerValue.TIMESTAMP
      });
    }
  });
}

/* ПОИСК ПОЛЬЗОВАТЕЛЯ */
let searchTimer=null;
$("searchUsername").addEventListener("input",()=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(searchUser,350);
});

async function searchUser(){
  const username=cleanUsername($("searchUsername").value);
  const result=$("searchResult");
  result.innerHTML="";

  if(username.length<3)return;

  try{
    const snap=await db.ref("usernames/"+username).once("value");
    const uid=snap.val();

    if(!uid){
      result.textContent="Пользователь не найден";
      result.style.color="var(--muted)";
      return;
    }

    if(uid===currentUser.uid){
      result.textContent="Это твой аккаунт";
      return;
    }

    const profileSnap=await db.ref("users/"+uid).once("value");
    const profile=profileSnap.val();
    if(!profile)return;

    const button=document.createElement("button");
    button.className="small-btn";
    button.style.width="100%";
    button.style.marginBottom="10px";
    button.textContent="＋ Написать @"+profile.username;
    button.onclick=()=>openChat(profile);
    result.appendChild(button);

  }catch(error){
    result.textContent=firebaseError(error);
  }
}

/* СПИСОК ЧАТОВ */
function loadChats(){
  if(chatListUnsubscribe)chatListUnsubscribe();

  chatListUnsubscribe=db.ref("userChats/"+currentUser.uid).on("value",async snap=>{
    const list=$("chatList");
    list.innerHTML="";

    const chats=snap.val()||{};
    const entries=Object.entries(chats);

    for(const [chatId,info] of entries){
      const otherUid=info.otherUid;
      if(!otherUid)continue;

      const profileSnap=await db.ref("users/"+otherUid).once("value");
      const profile=profileSnap.val();
      if(!profile)continue;

      const item=document.createElement("div");
      item.className="chat-item"+(activeChat===chatId?" active":"");

      const name=document.createElement("strong");
      name.textContent="@"+profile.username;

      const preview=document.createElement("small");
      preview.textContent="Открыть переписку";

      item.append(name,preview);
      item.onclick=()=>openChat(profile);
      list.appendChild(item);
    }
  });
}

/* ОТКРЫТИЕ ЧАТА */
async function openChat(profile){
  currentChatUser=profile;
  const chatId=chatIdFor(currentUser.uid,profile.uid);
  activeChat=chatId;

  await db.ref("chats/"+chatId+"/members").update({
    [currentUser.uid]:true,
    [profile.uid]:true
  });

  await db.ref("userChats/"+currentUser.uid+"/"+chatId).set({
    otherUid:profile.uid
  });

  await db.ref("userChats/"+profile.uid+"/"+chatId).set({
    otherUid:currentUser.uid
  });

  $("emptyState").classList.add("hidden");
  $("chatArea").classList.remove("hidden");
  $("chatName").textContent="@"+profile.username;
  $("messages").innerHTML="";
  appScreen.classList.add("chat-open");

  if(messagesUnsubscribe){
    db.ref("chats/"+activeChat+"/messages").off("value",messagesUnsubscribe);
  }
  if(statusUnsubscribe){
    db.ref("status/"+profile.uid).off("value",statusUnsubscribe);
  }

  const messagesRef=db.ref("chats/"+chatId+"/messages");
  messagesUnsubscribe=messagesRef.limitToLast(100).on("value",snap=>{
    const box=$("messages");
    box.innerHTML="";
    snap.forEach(child=>{
      const msg=child.val();
      const div=document.createElement("div");
      div.className="message"+(msg.uid===currentUser.uid?" mine":"");

      const content=document.createElement("div");
      content.textContent=msg.text||"";

      const time=document.createElement("time");
      time.textContent=msg.createdAt
        ?new Date(msg.createdAt).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})
        :"";

      div.append(content,time);
      box.appendChild(div);
    });
    box.scrollTop=box.scrollHeight;
  });

  const statusRef=db.ref("status/"+profile.uid);
  statusUnsubscribe=statusRef.on("value",snap=>{
    const status=snap.val();
    $("chatStatus").textContent=
      status&&status.state==="online"?"● В сети":"Не в сети";
  });

  loadChats();
}

/* ОТПРАВКА СООБЩЕНИЯ */
$("sendForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const text=$("messageInput").value.trim();
  if(!text||!activeChat)return;

  $("messageInput").value="";

  try{
    await db.ref("chats/"+activeChat+"/messages").push({
      uid:currentUser.uid,
      text,
      createdAt:firebase.database.ServerValue.TIMESTAMP
    });
  }catch(error){
    alert(firebaseError(error));
  }
});

/* НАЗАД */
$("backBtn").onclick=()=>{
  appScreen.classList.remove("chat-open");
};

/* ВЫХОД */
$("logoutBtn").onclick=async()=>{
  try{
    await auth.signOut();
  }catch(error){
    alert(firebaseError(error));
  }
};

function stopListeners(){
  if(chatListUnsubscribe){
    db.ref("userChats/"+currentUser.uid).off("value",chatListUnsubscribe);
    chatListUnsubscribe=null;
  }
  if(messagesUnsubscribe&&activeChat){
    db.ref("chats/"+activeChat+"/messages").off("value",messagesUnsubscribe);
    messagesUnsubscribe=null;
  }
  if(statusUnsubscribe&&currentChatUser){
    db.ref("status/"+currentChatUser.uid).off("value",statusUnsubscribe);
    statusUnsubscribe=null;
  }
}
</script>
</body>
</html>
