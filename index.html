*{box-sizing:border-box}
body{

button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#authScreen{
 min-height:100vh;display:flex;align-items:center;
 justify-content:center;padding:20px
}
.auth-box{
 width:100%;max-width:390px;background:var(--panel);
 padding:28px;border:1px solid var(--border);border-radius:20px
}
.logo{text-align:center;font-size:30px;font-weight:bold;margin-bottom:8px}
.subtitle{text-align:center;color:var(--muted);margin-bottom:25px}
.field{margin:13px 0}
.field label{

}
.field input{

 border:1px solid var(--border);background:var(--bg);color:white
}
.primary{
 width:100%;padding:14px;border:0;border-radius:11px;
 background:var(--accent);color:white;font-weight:bold;margin-top:10px

.primary:disabled{opacity:.6;cursor:wait}
.switch{text-align:center;color:var(--muted);font-size:14px;margin-top:20px}
.link-btn{

}
.error{color:#ff7777;font-size:13px;margin-top:12px;text-align:center}
#app{

.sidebar{

.top{

.brand{font-size:23px;font-weight:bold}
.me{

.me-info{min-width:0;flex:1}
.me-name{font-weight:bold}
.me-user{color:var(--muted);font-size:13px;margin-top:5px}
.avatar{

 background:var(--panel2);display:flex;align-items:center;
 justify-content:center;overflow:hidden;font-size:21px
}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.big{width:82px;height:82px;font-size:30px}
.search{padding:12px}
.search input{
 width:100%;padding:12px;border-radius:10px;
 border:1px solid var(--border);background:var(--bg);color:white
}
.search-result{padding:0 12px}
.small-btn{
 border:1px solid var(--border);background:var(--panel2);
 color:var(--text);padding:9px 12px;border-radius:9px
}
.chat-list{overflow:auto;flex:1}
.chat-item{
 padding:13px;border-bottom:1px solid var(--border);
 cursor:pointer;display:flex;align-items:center;gap:11px

.chat-item:hover,.chat-item.active{background:var(--panel2)}
.chat-info{min-width:0}

 background:transparent;color:#ff8585;border-radius:9px
}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.empty{

 text-align:center;color:var(--muted);padding:20px

.chat-header{

 display:flex;align-items:center;gap:12px
}
.chat-header strong{display:block}
.online{font-size:12px;color:var(--green);margin-top:4px}
.messages{
 flex:1;overflow:auto;padding:20px;display:flex;
 flex-direction:column;gap:10px
}
.message{
 max-width:78%;padding:11px 14px;border-radius:14px;
 background:var(--panel2);align-self:flex-start;
 overflow-wrap:anywhere;white-space:pre-wrap
}
.message.mine{background:#245b9c;align-self:flex-end}
.message time{

 color:#c5d5eb;margin-top:5px
}
.message img{
 display:block;max-width:100%;width:auto;max-height:280px;
 object-fit:contain;border-radius:9px;cursor:pointer

.send-area{
 padding:13px;border-top:1px solid var(--border);
 display:flex;gap:9px;align-items:center

 border:1px solid var(--border);background:var(--panel);color:white

 padding:12px 16px;border-radius:12px;font-weight:bold

.icon-btn{background:var(--panel2)!important;padding:12px!important}
#imageInput,#avatarInput{display:none}
#profileModal{

 align-items:center;justify-content:center;padding:20px;z-index:10

function firebaseError(error){
 const messages = {
  "auth/email-already-in-use":"Этот email уже зарегистрирован.",
  "auth/invalid-email":"Неправильный email.",
  "auth/weak-password":"Пароль слишком простой.",

  "auth/too-many-requests":"Слишком много попыток. Попробуй позже.",
  "auth/operation-not-allowed":"В Firebase не включён вход по Email/Password.",
  "PERMISSION_DENIED":"Firebase запретил доступ. Проверь Rules."
 };
 return messages[error.code] || error.message || "Произошла ошибка.";
}

/* СЖАТИЕ ИЗОБРАЖЕНИЙ */
function compressImage(file,maxSize=180000){
 return new Promise((resolve,reject)=>{
  if(!file.type.startsWith("image/")){
   reject(Error("Выбери изображение."));
   return;
  }
  if(file.size > 12*1024*1024){
   reject(Error("Фото больше 12 МБ."));
   return;
  }

  const reader = new FileReader();
  reader.onerror = () => reject(Error("Не удалось прочитать файл."));
  reader.onload = () => {
   const img = new Image();
   img.onerror = () => reject(Error("Не удалось открыть изображение."));
   img.onload = () => {
    const canvas = document.createElement("canvas");
    const maxSide = 900;
    let w = img.width;
    let h = img.height;

    if(w > maxSide || h > maxSide){
     const scale = Math.min(maxSide/w,maxSide/h);
     w = Math.round(w*scale);
     h = Math.round(h*scale);
    }

    canvas.width = w;
    canvas.height = h;
    canvas.getContext("2d").drawImage(img,0,0,w,h);

    let quality = .78;

    function attempt(){
     const data = canvas.toDataURL("image/jpeg",quality);
     if(data.length*.75 <= maxSize){
      resolve(data);
     }else if(quality > .35){
      quality -= .1;
      attempt();
     }else{
      reject(Error("Фото слишком большое даже после сжатия."));
     }
    }
    attempt();
   };
   img.src = reader.result;
  };
  reader.readAsDataURL(file);
 });
}

function setAvatar(element,data){
 element.innerHTML = "";
 if(data){
  const img = document.createElement("img");
  img.src = data;
  img.alt = "Аватар";
  element.appendChild(img);
 }else{
  element.textContent = "👤";
 }
}

/* РЕГИСТРАЦИЯ */
$("registerForm").addEventListener("submit",async event=>{
 event.preventDefault();
 showError("");

 if(!auth || !db){
  showError("Firebase не запущен. Обнови страницу.");
  return;
 }

 const username = cleanUsername($("regUsername").value);
 const email = $("regEmail").value.trim();
 const password = $("regPassword").value;

 if(!/^[a-z0-9_]{3,20}$/.test(username)){
  showError("Username: латинские буквы, цифры и _, от 3 до 20 символов.");
  return;
 }

 setBusy($("registerButton"),true,"Зарегистрироваться");

 try{
  const credential = await auth.createUserWithEmailAndPassword(email,password);
  const uid = credential.user.uid;

  const result = await db.ref("usernames/"+username)
   .transaction(value => value === null ? uid : undefined);

  if(!result.committed){
   await credential.user.delete();
   showError("Этот username уже занят.");
   return;
  }

  await db.ref("users/"+uid).set({
   uid:uid,
   username:username,
   email:email,
   createdAt:firebase.database.ServerValue.TIMESTAMP
  });

 }catch(error){
  showError(firebaseError(error));
 }finally{
  setBusy($("registerButton"),false,"Зарегистрироваться");
 }
});

/* ВХОД — ФОРМА НЕ ПЕРЕЗАГРУЖАЕТСЯ */
$("loginForm").addEventListener("submit",async event=>{
 event.preventDefault();
 event.stopPropagation();
 showError("");

 if(!auth){
  showError("Firebase не запущен. Обнови страницу.");
  return;
 }

 const email = $("loginEmail").value.trim();
 const password = $("loginPassword").value;

 if(!email || !password){
  showError("Введи email и пароль.");
  return;
 }

 setBusy($("loginButton"),true,"Войти");

 try{
  await auth.signInWithEmailAndPassword(email,password);
 }catch(error){
  showError(firebaseError(error));
  // При ошибке сохраняем введённые данные.
  $("loginEmail").value = email;
  $("loginPassword").value = password;
 }finally{
  setBusy($("loginButton"),false,"Войти");
 }
});

/* АВТОРИЗАЦИЯ */
auth.onAuthStateChanged(async user=>{
 if(!user){
  currentUser = null;
  myProfile = null;
  authReady = true;
  $("authScreen").classList.remove("hidden");
  $("app").classList.add("hidden");
  return;
 }

 currentUser = user;

 try{
  const snapshot = await db.ref("users/"+user.uid).once("value");
  myProfile = snapshot.val();

  if(!myProfile){
   showError("Профиль не найден. Старый аккаунт не удалён.");
   await auth.signOut();
   return;
  }

  $("authScreen").classList.add("hidden");
  $("app").classList.remove("hidden");

  $("myName").textContent = myProfile.username || "Пользователь";
  $("myUsername").textContent = "@"+(myProfile.username || "");
  setAvatar($("myAvatar"),myProfile.avatar || null);

  setupPresence();
  loadChats();

 }catch(error){
  showError("Не удалось загрузить профиль: "+firebaseError(error));
 }
});

/* СТАТУС ОНЛАЙН */
function setupPresence(){
 const status = db.ref("status/"+currentUser.uid);

 db.ref(".info/connected").on("value",snapshot=>{
  if(snapshot.val() === true){
   status.onDisconnect().set({
    state:"offline",
    lastSeen:firebase.database.ServerValue.TIMESTAMP
   });
   status.set({
    state:"online",
    lastSeen:firebase.database.ServerValue.TIMESTAMP
   });
  }
 });
}

/* АВАТАР */
$("editAvatarBtn").onclick = ()=>{

};

$("closeModalBtn").onclick = () =>
